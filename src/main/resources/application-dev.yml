spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/todo_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    root: INFO
    com.todoproject.todo_app: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    liquibase: INFO

jwt:
  secret: ${JWT_SECRET:MyFallbackSecretKeyForLocalDevelopmentOnly123456}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true