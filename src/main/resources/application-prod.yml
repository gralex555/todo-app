spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    root: WARN
    com.todoproject.todo_app: INFO
    org.hibernate.SQL: ERROR

springdoc:
  api-docs:
    enabled: false      # отключаем в продакшне
  swagger-ui:
    enabled: false      # отключаем в продакшне